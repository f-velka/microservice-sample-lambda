name: 'Terraform Plan'

on:
  workflow_dispatch:
  pull_request:
    paths: [
      "**.tf",
      ".github/workflows/**.yml",
      ".github/workflows/**.yaml"
    ]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_CLOUD_ORGANIZATION: "f-vlk-sample-org"
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  TF_WORKSPACE: "microservice-sample-lambda"
  CONFIG_DIRECTORY: "./"

jobs:
  terraform:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      add: ${{ steps.plan-output.outputs.add }}
      change: ${{ steps.plan-output.outputs.change }}
      destroy: ${{ steps.plan-output.outputs.destroy }}
      run_link: ${{ steps.plan-run.outputs.run_link }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Upload Configuration
      uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
      id: plan-upload
      with:
        workspace: ${{ env.TF_WORKSPACE }}
        directory: ${{ env.CONFIG_DIRECTORY }}
        speculative: true

    - name: Create Plan Run
      uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
      id: plan-run
      with:
        workspace: ${{ env.TF_WORKSPACE }}
        configuration_version: ${{ steps.plan-upload.outputs.configuration_version_id }}
        plan_only: true

    - name: Get Plan Output
      uses: hashicorp/tfc-workflows-github/actions/plan-output@v1.3.2
      id: plan-output
      with:
        plan: ${{ fromJSON(steps.plan-run.outputs.payload).data.relationships.plan.data.id }}

  update-pr:
    name: "Update Pull Request"
    runs-on: ubuntu-latest
    needs: terraform
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      issues: write
    steps:
    - name: Update PR Comment
      uses: actions/github-script@v8
      id: plan-comment
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          // 1. Retrieve existing bot comments for the PR
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const botComment = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes('HCP Terraform Plan Output'));
          const output = `#### HCP Terraform Plan Output
          \`\`\`
          Plan: ${{ needs.terraform.outputs.add }} to add, ${{ needs.terraform.outputs.change }} to change, ${{ needs.terraform.outputs.destroy }} to destroy.
          \`\`\`
          [HCP Terraform Plan](${{ needs.terraform.outputs.run_link }})
          `;
          // 3. Delete previous comment so PR timeline makes sense
          if (botComment) {
            await github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
            });
          };
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          });
